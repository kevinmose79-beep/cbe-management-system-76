name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web application
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://cbe-management-system-backend.onrender.com' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://csrttkkrlahzuswsvnsb.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_CgY9WjSl4c2qtY4BHJabrw_rbIuuwZ6' }}
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate and setup Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          if ! unzip -t android/gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Gradle wrapper JAR is corrupt or missing. Generating valid Gradle 8.13 wrapper..."
            curl -sSL "https://services.gradle.org/distributions/gradle-8.13-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
            /tmp/gradle-dist/gradle-8.13/bin/gradle wrapper --gradle-version 8.13 -p android
            rm -rf /tmp/gradle.zip /tmp/gradle-dist
          fi
          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbe-management-system-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release with Direct APK Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest Android APK
          body: "Direct Android APK download for CBE Management System (Capacitor Native Build)."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
